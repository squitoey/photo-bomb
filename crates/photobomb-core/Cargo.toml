[package]
name = "photobomb-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
blake3 = "1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "rayon"] }
kamadak-exif = "0.6"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
walkdir = "2"
dirs = "6"
dunce = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
trash = "5"

[target.'cfg(windows)'.dependencies]
file-id = "0.2"

[dev-dependencies]
tempfile = "3"
