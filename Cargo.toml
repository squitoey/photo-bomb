[workspace]
resolver = "2"
members = ["crates/photobomb-core", "crates/photobomb-cli", "apps/desktop/src-tauri"]

# The one place the version lives. Bumped by scripts/bump_version.py (see RELEASING.md).
[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3

# Decoding and hashing are far too slow unoptimised, even in dev builds.
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.photobomb-core]
opt-level = 3
